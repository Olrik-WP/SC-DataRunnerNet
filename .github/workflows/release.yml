name: Release (Velopack -> GitHub)

# Triggers:
#   - Pushing a tag of the form v1.2.3 publishes a stable release.
#   - Manual dispatch lets us re-run a release if something glitched out.
#
# Versioning policy:
#   The tag MUST match <Version> in Directory.Build.props. The job double-
#   checks this and fails fast on mismatch, so we never ship a binary whose
#   AssemblyInformationalVersion lies about itself.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  # Required so $GITHUB_TOKEN can create the GitHub Release and upload assets.
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Pull the canonical version from Directory.Build.props and confirm it
      # matches the tag (when triggered by tag push).
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $v = ($props.Project.PropertyGroup.Version | Select-Object -First 1).Trim()
          if (-not $v) { throw 'Version missing in Directory.Build.props' }

          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v',''
            if ($tag -ne $v) {
              throw "Tag v$tag does not match Directory.Build.props <Version>=$v. Sync them and push a new tag."
            }
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing v$v"

      - name: Restore
        run: dotnet restore SC-DataRunnerNet.sln

      # Self-contained publish: ships the .NET runtime alongside the app so
      # end users don't need to install .NET 9 separately. Velopack will
      # delta-pack subsequent releases, so the runtime weight is paid once.
      #
      # UexAppBearerToken: pulled from the GitHub Actions secret so end users
      # don't have to register their own UEX application. Directory.Build.props
      # turns it into [AssemblyMetadata("UexAppBearerToken", "...")] which the
      # AssemblyMetadataBuiltInAppTokenProvider reads at runtime. Set the
      # secret in: repo → Settings → Secrets and variables → Actions.
      # If the secret is missing, the build still succeeds — the binary just
      # asks the user for their own bearer token, like a self-build does.
      - name: Publish
        shell: pwsh
        env:
          UEX_APP_BEARER_TOKEN: ${{ secrets.UEX_APP_BEARER_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UEX_APP_BEARER_TOKEN)) {
            Write-Warning "UEX_APP_BEARER_TOKEN secret is empty — releasing WITHOUT an embedded app token. Users will be prompted to paste their own."
          } else {
            Write-Host "Embedding UEX app bearer token into the build (length=$($env:UEX_APP_BEARER_TOKEN.Length))."
          }
          dotnet publish src/DataRunner.App.Wpf/DataRunner.App.Wpf.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish `
            /p:SourceRevisionId=${{ github.sha }} `
            /p:UexAppBearerToken="$env:UEX_APP_BEARER_TOKEN"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Pull the previous release so vpk can compute the delta package.
      # First-ever release: this step exits non-zero, which is fine — we
      # `continue-on-error` and let `vpk pack` build a full package.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # --noPortable: skip the SC-DataRunner-win-Portable.zip artifact. The
      # portable bundle disables Velopack auto-update by design (the updater
      # needs the install layout to write into), so for an auto-update-first
      # project like this one it just clutters the Releases page and confuses
      # users.
      - name: Pack release
        run: >
          vpk pack
          --packId SC-DataRunner
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe DataRunner.App.exe
          --channel win
          --noPortable

      - name: Upload to GitHub Releases
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --releaseName "SC DataRunner v${{ steps.ver.outputs.version }}"
          --tag v${{ steps.ver.outputs.version }}
          --channel win
          --publish

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velopack-releases-v${{ steps.ver.outputs.version }}
          path: |
            Releases/**
            publish/**
          retention-days: 7
